packages:
  - example-apps/*
  - example-fragments/*
  - apps/*
  - packages/*
  - packages-private/*
  - .pi/extensions/*
  - scripts

catalog:
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-7: npm:typescript@^7.0.2
  vite: ^8.0.0
  vitest: ^4.1.4

overrides:
  esbuild@<=0.24.2: ">=0.25.0"
  unicorn-magic: 0.4.0
  zod@^4.0.0: 4.3.5

patchedDependencies:
  "@earendil-works/pi-ai@0.75.5": patches/@earendil-works__pi-ai.patch
  "@earendil-works/pi-ai@0.82.1": patches/@earendil-works__pi-ai-0.82.1.patch

allowBuilds:
  "@journeyapps/wa-sqlite": true
  better-sqlite3: true
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  "@prisma/client": false
  "@prisma/engines": false
  core-js: false
  esbuild: false
  fallow: false
  "@google/genai": false
  lefthook: false
  node-liblzma: false
  prisma: false
  protobufjs: false
  sharp: false
  workerd: false

minimumReleaseAgeExclude:
  - "@tanstack/browser-db-sqlite-persistence@0.2.14"
  - "@tanstack/db-ivm@0.1.19"
  - "@tanstack/db-sqlite-persistence-core@0.2.14"
  - "@tanstack/db@0.8.1"
  - "@tanstack/node-db-sqlite-persistence@0.2.14"
  - "@tanstack/react-db@0.3.1"
  - pi-mcp-adapter@2.29.0
