packages:
  - example-apps/*
  - example-fragments/*
  - apps/*
  - packages/*
  - packages-private/*
  - .pi/extensions/*
  - scripts

catalog:
  "@cloudflare/vite-plugin": 1.62.5
  "@cloudflare/vitest-plugin": 1.3.6
  "@cloudflare/workers-types": 5.20261001.1
  "@earendil-works/pi-agent-core": 0.83.0
  "@earendil-works/pi-ai": 0.83.0
  "@earendil-works/pi-coding-agent": 1.0.0
  "@earendil-works/pi-tui": 1.0.0
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  js-tokens: 10.0.0
  miniflare: 5.20261001.0-alpha
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: npm:@typescript/typescript6@^6.0.2
  typescript-7: npm:typescript@^7.0.2
  vite: ^8.0.0
  vitest: ^4.1.4
  wrangler: 4.147.0

overrides:
  "@earendil-works/pi-ai@<1.0.0": 0.83.0
  esbuild@<=0.24.2: ">=0.25.0"
  unicorn-magic: 0.4.0
  # One copy each in the Worker bundles; Pi pins exact typebox versions per release.
  typebox: 1.3.27
  zod@^4.0.0: 4.6.7

packageExtensions:
  # Its published declarations need Babel 7 types, not the hoisted Babel 8 used by Vitest 5.
  babel-dead-code-elimination@1:
    dependencies:
      "@types/babel__core": ^7.20.5
      "@types/babel__traverse": ^7.28.0

allowBuilds:
  "@journeyapps/wa-sqlite": true
  better-sqlite3: true
  # Optional native speedup for cbor-x, which rivetkit uses; the JS fallback works.
  cbor-extract: false
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  "@prisma/client": false
  "@prisma/engines": false
  core-js: false
  esbuild: false
  fallow: false
  "@google/genai": false
  lefthook: false
  node-liblzma: false
  prisma: false
  protobufjs: false
  sharp: false
  workerd: false

minimumReleaseAgeExclude:
  - "@tanstack/browser-db-sqlite-persistence@0.2.36"
  - "@tanstack/db-ivm@0.2.0"
  - "@tanstack/db-sqlite-persistence-core@0.4.11"
  - "@tanstack/db@0.15.1"
  - "@tanstack/node-db-sqlite-persistence@0.2.36"
  - "@tanstack/react-db@0.5.11"
  - "@rivet-dev/durable-object-migrator@1.0.0"

patchedDependencies:
  "@cloudflare/worker-bundler@0.2.2": patches/@cloudflare__worker-bundler@0.2.2.patch
  "@earendil-works/pi-ai@0.83.0": patches/@earendil-works__pi-ai-0.83.0.patch
