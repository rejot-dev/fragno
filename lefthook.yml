#   https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  piped: true
  jobs:
    - name: lint
      run: pnpm exec turbo run lint:package '//#lint:root' --affected --output-logs errors-only
    - name: format
      run:
        sh -c 'node scripts/format-files.mjs --staged --check; code=$?; node
        scripts/format-files.mjs --staged; exit $code'
    - name: "codemode static types: update generated files"
      run: pnpm --filter @fragno-apps/backoffice-rr run codemode:fix
    - name: "backoffice context graph: check staged generated file"
      run: pnpm backoffice:context:check-staged
    - name: "changeset status: validate frontmatter"
      run: pnpm exec changeset status
      glob: ".changeset/**"
    - name: "og images: check blog posts have images"
      run: pnpm exec tsx apps/docs/scripts/generate-og-images.tsx --check
      glob: "apps/docs/content/blog/**"

commit-msg:
  commands:
    "Check commit message format":
      run: scripts/commit-msg {1}
